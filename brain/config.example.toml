# Venus brain config — copy this file to config.toml and fill in your own values.
# config.toml is gitignored; this .example template is committed.

# API key the laptop app requires on every request (except /health).
# Generate a long random string, e.g. in PowerShell:
#   [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Max 256 }))
api_key = "change-me"

# Address the laptop app binds to. Default 127.0.0.1 (localhost only).
# To let the Pi/devices reach the brain over the tailnet, set this to the
# laptop's tailnet IP (e.g. "100.76.45.98") or "0.0.0.0" for all interfaces.
# Ollama stays localhost-only regardless; only this app port is exposed.
host = "127.0.0.1"

# Port the laptop app (the only exposed port) listens on.
port = 8080

# Ollama stays localhost-only. The brain talks to it here.
ollama_url = "http://127.0.0.1:11434"

# Context window per turn. 4096 keeps two 3B models resident in 8 GB VRAM.
num_ctx = 4096

# Cross-run memory: each bot recalls what it concluded in earlier conversations.
# Recalled summaries are appended to that bot's system prompt at the start of a
# new run. Set enabled = false for a clean A/B against memory-off runs.
[memory]
enabled      = true   # false => bots are amnesiac, exactly as in v1.0
recall_limit = 3      # how many recent summaries to inject (keeps num_ctx safe)
summarize    = true   # true => one model call distils each run into a sentence;
                      # false => store a trimmed last-turn snippet (no extra call)

# The two different minds. Different model families = different behaviour.
[bots.bot1]
model   = "llama3.2:3b"
body    = "esp32"
persona = "personas/bot1_esp32.txt"

[bots.bot2]
model   = "qwen2.5:3b"
body    = "pi"
persona = "personas/bot2_pi.txt"
