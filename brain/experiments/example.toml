# One experiment = one reproducible run. Copy this file, change one variable at a
# time (a model, a persona, the task), run it, and compare the saved transcripts.
#
# Run it with:  python run_experiment.py experiments/example.toml

task = "Design a cheap, low-power way to tell whether a houseplant needs watering, using only what an ESP32 can sense and what a Raspberry Pi can compute. Agree on one concrete design."
turn_limit = 8

# A bot ends the conversation early by including this exact token in a reply.
stop_marker = "CONVERGED"

[bots.bot1]
model   = "llama3.2:3b"
body    = "esp32"
persona = "personas/bot1_esp32.txt"

[bots.bot2]
model   = "qwen2.5:3b"
body    = "pi"
persona = "personas/bot2_pi.txt"
